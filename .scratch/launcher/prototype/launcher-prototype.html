<label>Example scene<select id="scene"><option value="everyday">Everyday · VR not yet verified</option><option value="ready">Ready · prerequisite checks passed</option><option value="setup">First setup</option><option value="extracting">Long extraction</option><option value="vr-missing">VR prerequisite missing</option><option value="unknown">Readiness inconclusive</option><option value="fallback">VR fell back to flat</option><option value="update">Manual update</option><option value="rollback">Update failed · restored</option></select></label>
<label>Example platform<select id="platform"><option>Windows</option><option>Linux</option></select></label>
<button id="reset" style="--edge:var(--border,#bbb);--soft:var(--card,#f8f8f6);--ink:var(--foreground,#24342a);padding:7px 11px;font-size:12px">Reset demo</button>
</div>
<main id="app"></main>
<aside class="study-state" id="study-state" aria-live="polite"></aside>
<nav class="switcher" aria-label="Prototype layouts">
<button class="arrow" id="previous" aria-label="Previous layout">←</button>
<select id="layout-select" aria-label="Choose a layout"><optgroup label="New horror-inspired designs"><option value="F">F  Fog menu</option><option value="G">G  Selected design</option></optgroup><optgroup label="Earlier designs"><option value="A">A  Play first</option><option value="B">B  Utility</option><option value="C">C  Guided</option><option value="D">D  Compact</option><option value="E">E  Two choices</option></optgroup></select>
<button class="arrow" id="next" aria-label="Next layout">→</button>
</nav>
<script>
'use strict';
const names={A:'Play first',B:'Utility',C:'Guided',D:'Compact',E:'Two choices',F:'Fog menu',G:'Selected design'};
const params=new URLSearchParams(location.search);
let variant=names[params.get('variant')]?params.get('variant'):'G';
const demo={scene:'everyday',platform:'Windows',view:'home',launchMode:'flat',running:false,progress:42,source:'',event:'',settings:{resolution:'1920 × 1080',window:'Windowed',preset:'Original (PS4)',volume:'80',microphone:'System default',voiceKey:false,turn:'Snap',scale:'1.0'}};
const app=document.getElementById('app');
function esc(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function button(label,action,primary,disabled){return '<button type="button" data-action="'+action+'" class="'+(primary?'primary':'')+'" '+(disabled?'disabled':'')+'>'+label+'</button>';}
function badge(text,kind){return '<span class="tag '+(kind||'')+'">'+text+'</span>';}
function flatStatus(){return demo.scene==='setup'||demo.scene==='extracting'?'Needs setup':demo.scene==='unknown'?'Could not verify':'Ready';}
function vrStatus(){if(demo.scene==='setup'||demo.scene==='extracting')return 'Needs setup';if(demo.scene==='vr-missing')return 'Needs attention';if(demo.scene==='fallback')return 'Did not start';if(demo.scene==='ready')return 'Prerequisites found';return 'Not yet verified';}
function flatButton(){return button(demo.running?'Game running':flatStatus()==='Could not verify'?'Try flat anyway':'Play','flat',true,demo.running||flatStatus()==='Needs setup');}
function vrButton(){return button(demo.running?'Game running':demo.scene==='ready'?'Play in VR':'Try VR anyway','vr',false,demo.running||['Needs setup','Needs attention'].includes(vrStatus()));}
function statusRows(){return '<div class="status"><div><strong>Play on your display</strong><p>'+ (flatStatus()==='Ready'?'Game files and runtime found in this example.':flatStatus()==='Needs setup'?'Prepare your own game files first.':'A check could not finish. You can still try launching.')+'</p></div>'+badge(flatStatus(),flatStatus()==='Ready'?'good':'warn')+'</div><div class="status"><div><strong>Play in VR</strong><p>'+(demo.scene==='vr-missing'?'Connect your headset and start your chosen OpenXR runtime.':demo.scene==='fallback'?'The game continued on your display.':demo.scene==='ready'?'Example prerequisite checks passed; physical validation still pending.':demo.platform==='Windows'?'Quest 3 · Steam Link · active runtime unconfirmed':'Native Linux VR · headset/runtime not yet selected')+'</p></div>'+badge(vrStatus(),demo.scene==='ready'?'good':'warn')+'</div>';}
function fallback(){if(demo.scene!=='fallback')return '';return '<div class="notice"><strong>VR did not start. You are playing flat.</strong><p>You can keep playing, or close the game before trying VR again.</p><div class="actions">'+button('Continue flat','continue',true)+button('Close and retry VR','retry-launch')+button('View log','log')+'</div></div>';}
function recovery(){if(demo.scene==='vr-missing')return '<div class="notice"><strong>Your display is ready. VR needs attention.</strong><p>'+(demo.platform==='Windows'?'Connect your Quest 3, establish your Steam Link connection, and start the OpenXR runtime you use.':'Connect your chosen headset and start its OpenXR runtime. Linux hardware validation is still pending.')+'</p><div class="actions">'+button('Show setup steps','help')+button('Retry VR checks','retry',true)+'</div></div>';if(demo.scene==='unknown')return '<div class="notice"><strong>We could not verify this setup.</strong><p>This is an inconclusive result, not a confirmed incompatibility. You can retry the check or try playing.</p>'+button('Retry checks','retry')+'</div>';return '';}
function settingsPanel(){const s=demo.settings;function opts(items,current){return items.map(function(x){return '<option '+(x===current?'selected':'')+'>'+esc(x)+'</option>';}).join('');}return '<h2 class="sectiontitle">Before you play</h2><p class="muted">Preferences for '+demo.platform+'. Changes made in-game are kept. Advanced options are available in the game.</p><div class="sectionlabel">Display & sound</div><div class="formgrid"><label>Resolution<select data-setting="resolution">'+opts(['1280 × 720','1920 × 1080','2560 × 1440'],s.resolution)+'</select></label><label>Window mode<select data-setting="window">'+opts(['Windowed','Borderless','Fullscreen'],s.window)+'</select></label><label>Graphics preset<select data-setting="preset">'+opts(['Low','Medium','Original (PS4)','High','Ultra','Custom'],s.preset)+'</select></label><label>Volume<input data-setting="volume" type="range" min="0" max="100" value="'+esc(s.volume)+'"></label><label>Microphone<select data-setting="microphone">'+opts(['System default','Choose in game'],s.microphone)+'</select></label><label><input data-setting="voiceKey" type="checkbox" '+(s.voiceKey?'checked':'')+'>Use voice-key fallback</label></div><div class="sectionlabel">VR comfort</div><div class="formgrid"><label>Turning<select data-setting="turn">'+opts(['Snap','Smooth'],s.turn)+'</select></label><label>Eye resolution scale<select data-setting="scale">'+opts(['0.7','1.0','1.3'],s.scale)+'</select></label></div><div class="actions">'+button('Apply demo settings','save-settings',true,demo.running)+button('Back to play','home')+'</div>'+(demo.running?'<p class="muted">Close the game before applying settings.</p>':'');}
function setupPanel(){return '<h2 class="sectiontitle">Bring your copy of P.T.</h2><p class="muted">Choose your extracted game folder or supported fake PKG. Already have a portable bundle? Use it as it is.</p><label class="field">Game source<input id="source-path" placeholder="Your dump folder or fake PKG" value="'+esc(demo.source)+'"></label><div class="actions">'+button('Choose folder…','choose-folder')+button('Choose PKG…','choose-pkg')+'</div><label class="field">Destination folder<input value="pt-pcport" id="destination-path"></label><div class="notice"><strong>Your files stay yours.</strong><p>Game archives, saves and mods stay together. Linux and Windows keep separate preferences.</p></div><div class="actions">'+button('Prepare game','install',true,!demo.source)+button('Use existing bundle…','adopt')+'</div><p class="muted">Choosing files is simulated in this study.</p>';}
function extractingPanel(){return '<h2 class="sectiontitle">Preparing your game</h2><p class="muted">Extracting your game archives. This may take a few minutes; your source is kept unchanged.</p><div class="progressbar"><span style="width:'+demo.progress+'%"></span></div><div class="factrow"><span>Archive extraction</span><strong>'+demo.progress+'%</strong></div><div class="factrow"><span>Destination</span><strong>pt-pcport</strong></div><div class="actions" style="margin-top:22px">'+button('Cancel preparation','cancel')+'</div><p class="muted">Demo controls: '+button('Advance extraction','advance')+'</p>';}
function updatePanel(){return '<h2 class="sectiontitle">Update your bundle</h2><p class="muted">Manual updates from your personal downstream.</p>'+(demo.scene==='rollback'?'<div class="notice"><strong>The update could not finish.</strong><p>The previous program files were restored in this example. Your saves, mods and settings are kept.</p></div>':'<div class="factrow"><span>Release</span><strong>'+(demo.scene==='update'?'Example paired launcher + runtime':'No update check requested')+'</strong></div>')+'<div class="actions" style="margin-top:20px">'+button('Check for updates','check-update')+button('Install example update','update',true,demo.running||demo.scene!=='update')+'</div><p class="muted">'+(demo.running?'Close the game before installing an update.':'The launcher and matching runtime update together. Player data is preserved.')+'</p><div class="actions">'+button('Simulate update failure','fail-update')+button('Back to play','home')+'</div>';}
function mainPanel(){if(demo.view==='settings')return settingsPanel();if(demo.view==='updates'||['update','rollback'].includes(demo.scene))return updatePanel();if(demo.scene==='setup'||demo.view==='setup')return setupPanel();if(demo.scene==='extracting')return extractingPanel();return '';}
function eventText(){return demo.event?'<p class="event" aria-live="polite">'+esc(demo.event)+'</p>':'';}
function titlebar(){return '<div class="windowbar"><strong>P.T. · Personal launcher</strong><span>'+demo.platform+' · simulated</span><i aria-hidden="true">− □ ×</i></div>';}
function quietVariant(){const panel=mainPanel();return '<section class="window">'+titlebar()+'<div class="quiet">'+(panel?'<div class="back">'+button('← Play','home')+'</div>'+panel:'<div class="hero"><div><div class="eyebrow">Your copy. Your way back.</div><h1 class="wordmark">P.T.</h1><p class="subtitle">The hallway is waiting.</p></div><div class="launchstack">'+flatButton()+vrButton()+'<span class="muted">Choose the mode for this session.</span></div></div><div class="meta"><span>Portable bundle · <strong>pt-pcport</strong></span><span>Shared saves & mods</span></div>'+fallback()+recovery()+statusRows())+eventText()+'<div class="foot"><span>'+ (demo.running?'Session running':'Ready when you are')+'</span><div class="actions">'+button('Settings','settings')+button('Prepare / repair','setup')+button('Updates','updates')+(demo.running?button('End demo session','stop'):'')+'</div></div></div></section>';}
function utilityVariant(){const panel=mainPanel();return '<section class="window utility-window">'+titlebar()+'<div class="utility"><nav class="sidebar"><h1>P.T.</h1>'+button('Overview','home',false)+button('Settings','settings')+button('Prepare / repair','setup')+button('Updates','updates')+'<small>One portable bundle<br>Upstream-compatible game</small></nav><div class="workspace"><div class="toolbar"><h2>'+(demo.view==='home'?'Your installation':'P.T. launcher')+'</h2>'+badge(demo.running?'Game running':'Portable')+'</div>'+(panel||'<div class="bundlepath">pt-pcport / runtime / '+demo.platform.toLowerCase()+'</div>'+statusRows()+fallback()+recovery()+'<div class="sectionlabel">This bundle</div><div class="factrow"><span>Game archives</span><strong>Shared between platforms</strong></div><div class="factrow"><span>Saves & mods</span><strong>Existing folders</strong></div><div class="factrow"><span>VR target</span><strong>'+(demo.platform==='Windows'?'Meta Quest 3':'Not selected')+'</strong></div><div class="launchrow">'+flatButton()+vrButton()+(demo.running?button('End demo session','stop'):'')+'</div>')+eventText()+'</div></div></section>';}
function guidedVariant(){const panel=mainPanel();const setup=['setup','extracting'].includes(demo.scene)||demo.view==='setup';return '<section class="window guided-window">'+titlebar()+'<div class="guided"><header><div class="eyebrow">A little preparation. Then play.</div>'+badge(demo.platform+' bundle')+'</header><h1 style="margin-top:10px"><em>P.T.</em> &nbsp; Your next session</h1><ol class="steps"><li class="'+(setup?'current':'')+'">01 · Your copy<span>Choose or adopt</span></li><li class="'+(!setup?'current':'')+'">02 · Get ready<span>Files & headset</span></li><li>03 · Play<span>Display or VR</span></li></ol><div class="stage">'+(panel||'<div class="eyebrow">Your game is prepared</div><h2>How would you like to play?</h2><p class="lead">Your progress and mods are already here. Check your headset only when you want VR.</p>'+fallback()+recovery()+'<div class="actions">'+flatButton()+vrButton()+'</div><div style="margin-top:18px">'+statusRows()+'</div>')+eventText()+'</div><footer><div class="actions">'+button('Your copy','setup')+button('Preferences','settings')+button('Updates','updates')+'</div>'+(demo.running?button('End demo session','stop'):'<span class="muted">pt-pcport · shared saves</span>')+'</footer></div></section>';}

function simpleChrome(){return '<div class="simple-chrome"><span>P.T. launcher</span><span>'+demo.platform+'</span></div>';}
function modeMessage(mode){
  const status=mode==='flat'?flatStatus():vrStatus();
  if(status==='Needs setup')return 'Add your game files before you play.';
  if(mode==='flat')return status==='Ready'?'Your game is ready to play.':'We could not finish a check. You can still try playing.';
  if(status==='Needs attention')return 'Connect your headset and start the VR app you use, then check again.';
  if(status==='Prerequisites found')return 'The example checks passed. You can start VR.';
  if(status==='Did not start')return 'VR did not start. The game continued on your display.';
  return 'Your headset has not been checked. You can still try VR.';
}
function compactVariant(){
  const panel=mainPanel();
  const mode=demo.launchMode||'flat';
  const status=mode==='flat'?flatStatus():vrStatus();
  const blocked=demo.running||['Needs setup','Needs attention'].includes(status);
  const label=demo.running?'Game running':mode==='flat'?(flatStatus()==='Could not verify'?'Try playing anyway':'Play'):['Not yet verified','Did not start'].includes(status)?'Try VR anyway':'Play in VR';
  const home='<div class="compact-heading"><h1>P.T.</h1><div class="compact-folder"><span>pt-pcport</span>'+button('Change','setup',false,demo.running)+'</div></div>'
    +'<fieldset class="mode-picker"><legend>Where would you like to play?</legend><label class="mode-option"><input type="radio" name="launch-mode" value="flat" '+(mode==='flat'?'checked':'')+' '+(demo.running?'disabled':'')+'><span><strong>On my display</strong><small>Use your monitor and usual controls</small></span></label><label class="mode-option"><input type="radio" name="launch-mode" value="vr" '+(mode==='vr'?'checked':'')+' '+(demo.running?'disabled':'')+'><span><strong>In my headset</strong><small>'+(demo.platform==='Windows'?'Meta Quest 3 through Steam Link':'Use a compatible VR headset')+'</small></span></label></fieldset>'
    +'<div class="mode-readiness"><p>'+esc(modeMessage(mode))+'</p>'+((mode==='vr'&&status!=='Prerequisites found')||status==='Could not verify'?button('Check again','retry'):'')+'</div>'
    +'<button type="button" class="primary compact-launch" data-action="'+mode+'" '+(blocked?'disabled':'')+'>'+label+'</button>'
    +(demo.running?'<div class="session-strip"><span>Session running</span>'+button('End demo session','stop')+'</div>':'')
    +fallback()
    +'<details class="simple-details"><summary>Show check details</summary><p>Display: '+flatStatus()+'. VR: '+vrStatus()+'.</p><p>'+(demo.platform==='Windows'?'The active OpenXR runtime is still unconfirmed.':'Linux headset and runtime selection are still pending.')+'</p></details>';
  return '<section class="window compact-window">'+simpleChrome()+'<div class="compact-content">'+(panel?'<div class="back">'+button('Back to play','home')+'</div>'+panel:home)+eventText()+'<nav class="compact-tools" aria-label="Launcher tools">'+button('Settings','settings')+button('Game files','setup')+button('Updates','updates')+'</nav></div></section>';
}
function deviceIcon(mode){
  return '<span class="choice-icon"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">'+(mode==='flat'?'<rect x="3" y="5" width="34" height="23" rx="2"/><path d="M20 28v7M11 35h18"/>':'<path d="M9 11c6-3 16-3 22 0l5 5v14c-4 3-9 3-12-1l-4-4-4 4c-3 4-8 4-12 1V16l5-5Z"/><path d="M4 18h32M12 24h1m14 0h1"/>')+'</svg></span>';
}
function choiceRow(mode){
  const status=mode==='flat'?flatStatus():vrStatus();
  const blocked=demo.running||['Needs setup','Needs attention'].includes(status);
  const title=mode==='flat'?(status==='Could not verify'?'Try playing on my display':'Play on my display'):['Not yet verified','Did not start'].includes(status)?'Try VR anyway':'Play in VR';
  const subtitle=mode==='flat'?(status==='Needs setup'?'Add your game files first.':'Use your monitor and usual controls.'):(status==='Needs attention'?'Connect your headset, then check again.':demo.platform==='Windows'?'Use your Meta Quest 3 through Steam Link.':'Use your chosen VR headset.');
  const shortStatus=demo.running?'Running':status==='Not yet verified'?'Not checked':status==='Prerequisites found'?'Ready to try':status;
  return '<button class="choice-row" type="button" data-action="'+mode+'" '+(blocked?'disabled':'')+'>'+deviceIcon(mode)+'<span class="choice-copy"><strong>'+title+'</strong><small>'+subtitle+'</small></span><span class="choice-status '+(['Ready','Prerequisites found'].includes(status)?'good':'warn')+'">'+shortStatus+'</span></button>';
}
function twoChoicesVariant(){
  const panel=mainPanel();
  const home='<h2>Choose how to play</h2><p class="intro">Your game files, saves and mods stay in pt-pcport.</p><div class="choice-list">'+choiceRow('flat')+choiceRow('vr')+'</div>'
    +((demo.scene==='everyday'||demo.scene==='unknown')?'<div class="twochoices-help"><span>VR has not been checked.</span>'+button('Check VR','retry')+'</div>':'')
    +recovery()+fallback()
    +(demo.running?'<div class="session-strip"><span>Your game is running</span>'+button('End demo session','stop')+'</div>':'')
    +'<div class="twochoices-settings"><span>'+esc(demo.settings.window)+'<br>'+esc(demo.settings.resolution)+'</span>'+button('Change settings','settings')+'</div>';
  return '<section class="window twochoices-window"><header class="twochoices-header"><h1>P.T.</h1><span>'+demo.platform+'</span></header><div class="twochoices-content">'+(panel?'<div class="back">'+button('Back to play','home')+'</div>'+panel:home)+eventText()+'<nav class="twochoices-footer" aria-label="Launcher tools">'+button('Game files','setup')+button('Updates','updates')+'</nav></div></section>';
}

  return '<svg class="fog-scene" viewBox="0 0 720 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>'
  +'<linearGradient id="fog-sky" x2="0" y2="1"><stop stop-color="#c6cec2"/><stop offset=".65" stop-color="#e0e4d9"/><stop offset="1" stop-color="#b5bfb0"/></linearGradient>'
  +'<linearGradient id="fog-road" x2="0" y2="1"><stop stop-color="#c6cdc0"/><stop offset="1" stop-color="#8d998c"/></linearGradient>'
  +'<linearGradient id="fog-menu-haze"><stop stop-color="#e8ebe0" stop-opacity=".98"/><stop offset=".43" stop-color="#e6e9de" stop-opacity=".88"/><stop offset="1" stop-color="#d7ded1" stop-opacity=".05"/></linearGradient>'

  +'<path d="m524 385-9-283m2 81-31-43-8-35m40 123 37-51 7-46m-43 126-49-28" stroke-width="3" opacity=".3"/>'

  +'<g stroke="#73806d" stroke-width="3" opacity=".45"><path d="m509 411 211 73m-191-72v34m27-25v36m31-25v36m34-24v38m37-24v42m39-24v43"/><path d="m492 392 228 66"/></g>'
  +'<g fill="#e6eade" filter="url(#fog-soft)" opacity=".72"><ellipse cx="397" cy="325" rx="340" ry="46"/><ellipse cx="594" cy="377" rx="270" ry="26"/><ellipse cx="542" cy="467" rx="212" ry="17"/></g>'
  +'<path fill="url(#fog-menu-haze)" d="M0 0h720v620H0z"/><path fill="#4c5948" filter="url(#fog-grain)" d="M0 0h720v620H0z"/></svg>';
}
function foyerArtwork(){
  return '<svg viewBox="0 0 360 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>'
  +'<linearGradient id="foyer-wall"><stop stop-color="#555744"/><stop offset="1" stop-color="#353b30"/></linearGradient>'
  +'<linearGradient id="foyer-door" x2="1" y2="0"><stop stop-color="#383426"/><stop offset=".6" stop-color="#49412e"/><stop offset="1" stop-color="#25271e"/></linearGradient>'
  +'<linearGradient id="foyer-floor" x2="0" y2="1"><stop stop-color="#5a4b34"/><stop offset="1" stop-color="#211e19"/></linearGradient>'
  +'<radialGradient id="foyer-light"><stop stop-color="#d8b573" stop-opacity=".6"/><stop offset="1" stop-color="#d8b573" stop-opacity="0"/></radialGradient>'
  +'<pattern id="foyer-paper" width="28" height="42" patternUnits="userSpaceOnUse"><path d="m14 6 7 11-7 12-7-12zM14 1v40" stroke="#858267" stroke-width=".65" opacity=".25" fill="none"/><circle cx="14" cy="17" r="2" fill="#989070" opacity=".2"/></pattern>'
  +'<filter id="foyer-grain"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" stitchTiles="stitch" seed="14"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer></filter></defs>'
  +'<path d="M0 0h360v560H0z" fill="url(#foyer-wall)"/><path d="M0 0h360v440H0z" fill="url(#foyer-paper)"/>'
  +'<path d="m0 410 360-24v174H0z" fill="url(#foyer-floor)"/><path d="m0 390 360-18v15L0 414z" fill="#22271f"/><path d="m0 390 360-18" stroke="#8d8060" stroke-width="3"/>'
  +'<g stroke="#807052" stroke-width="1" opacity=".35"><path d="m177 397-69 163m90-163-11 163m29-164 50 164m-108-163L22 560m208-164 120 164M0 451h360M0 488h360M0 535h360"/></g>'
  +'<path d="M132 80h174v350l-174 10z" fill="#20261e"/><path d="M143 90h150v335l-150 8z" fill="#736647"/><path d="M153 103h129v316l-129 6z" fill="#090d0b"/>'
  +'<path d="m157 105 86 31v297l-86-13z" fill="url(#foyer-door)" stroke="#1e231b" stroke-width="3"/>'
  +'<g stroke="#786748" stroke-width="1.6" fill="none" opacity=".65"><path d="m168 127 62 20v110l-62-10z"/><path d="m168 271 62 8v132l-62-9z"/><path d="m177 136 43 13v96l-43-7z"/><path d="m177 284 43 4v109l-43-7z"/></g>'
  +'<path d="m245 136 36-33v316l-36 14z" fill="#d8b573" opacity=".13"/><path d="m245 433 36-14L360 560H168z" fill="#d8b573" opacity=".09"/>'
  +'<path d="M151 103h132M142 90h151M135 82h169" stroke="#b29560" opacity=".4"/><ellipse cx="231" cy="272" rx="3" ry="6" fill="#d8b573"/><path d="m230 270-10-2" stroke="#d8b573" stroke-width="3"/>'
  +'<path d="M0 116h87v111H0z" fill="#29281e" stroke="#80704e" stroke-width="5"/><path d="M8 125h70v92H8z" fill="#66705c"/><path d="m8 189 32-25 38 31v22H8z" fill="#343f31"/><path d="m19 194 30-47 18 47z" fill="#8d937b" opacity=".4"/>'
  +'<path d="M88 0v44" stroke="#24271f" stroke-width="3"/><path d="m63 45 14-15h24l17 15-3 19H65z" fill="#aa9467"/><ellipse cx="91" cy="64" rx="23" ry="5" fill="#dcc18a"/>'
  +'<ellipse cx="100" cy="98" rx="112" ry="119" fill="url(#foyer-light)"/><path d="M320 0 310 194m8 26-4 79m-214-44-2 79m-76-95 6 122" stroke="#1e291e" stroke-width="1" opacity=".4"/>'
  +'<path d="M0 0h360v560H0z" fill="#363a2c" filter="url(#foyer-grain)"/></svg>';
}
function horrorPlayLabel(mode){
  if(mode==='flat')return 'Play';
  return ['Not yet verified','Did not start'].includes(vrStatus())?'Try VR anyway':'Play in VR';
}
function horrorPlayButton(mode,kind){
  const status=mode==='flat'?flatStatus():vrStatus();
  return '<button type="button" data-action="'+mode+'" class="'+kind+'" '+(demo.running||['Needs setup','Needs attention'].includes(status)?'disabled':'')+'>'+horrorPlayLabel(mode)+'</button>';
}
function fogVariant(){
  const panel=mainPanel();
  const home='<div class="fog-mainmenu"><h1>P.T.</h1><p class="welcome">'+(demo.running?'Your game is running.':modeMessage('flat'))+'</p><nav aria-label="Play P.T.">'+horrorPlayButton('flat','fog-menulink play-link')+horrorPlayButton('vr','fog-menulink')+'</nav><nav class="fog-tools" aria-label="Launcher tools">'+button('Settings','settings')+button('Game files','setup')+button('Updates','updates')+'</nav><div class="fog-status"><p>Display: '+flatStatus()+'.</p><p>VR: '+vrStatus()+'.</p>'+(!demo.running?button('Check again','retry'):button('End demo session','stop'))+'</div></div>';
  return '<section class="window fog-window">'+simpleChrome()+'<div class="fog-stage">'+fogArtwork()+(panel?'<div class="fog-panel"><div class="back">'+button('Back to play','home')+'</div>'+panel+'</div>':home+recovery()+fallback())+eventText()+'</div></section>';
}
function foyerVariant(){
  const panel=mainPanel();
  const home='<h1>P.T.</h1>'+(flatStatus()==='Could not verify'?'<p class="foyer-vr-note">We could not finish a check. You can still try playing.</p>':'')+'<div class="foyer-launch">'+horrorPlayButton('flat','primary')+horrorPlayButton('vr','')+'</div><div class="foyer-vr-note"><p>'+ (demo.platform==='Windows'?'Quest 3 through Steam Link.':'Your chosen VR headset.')+'</p><p>'+esc(modeMessage('vr'))+'</p>'+(!demo.running?button('Check VR','retry'):button('End demo session','stop'))+'</div>'+recovery()+fallback();
  return '<section class="window foyer-window">'+simpleChrome()+'<div class="foyer-grid '+(panel?'has-panel':'')+'"><div class="foyer-art"><img src="assets/spooky-forest.jpg" alt="Tangled bare trees arching over a forest path in thick fog"></div><div class="foyer-controls">'+(panel?'<div class="back">'+button('Back to play','home')+'</div>'+panel:home)+eventText()+'<nav class="foyer-tools" aria-label="Launcher tools">'+button('Settings','settings')+button('Game files','setup')+button('Updates','updates')+'</nav><div class="foyer-bundle">pt-pcport</div></div></div></section>';
}

function render(){app.innerHTML=variant==='A'?quietVariant():variant==='B'?utilityVariant():variant==='C'?guidedVariant():variant==='D'?compactVariant():variant==='E'?twoChoicesVariant():variant==='F'?fogVariant():foyerVariant();document.getElementById('layout-select').value=variant;document.querySelectorAll('[data-variant]').forEach(function(b){b.classList.toggle('current',b.dataset.variant===variant);b.setAttribute('aria-pressed',b.dataset.variant===variant?'true':'false');});document.getElementById('scene').value=demo.scene;document.getElementById('platform').value=demo.platform;document.getElementById('study-state').innerHTML='<strong>'+variant+' '+names[variant]+'</strong> — example state, not detected hardware<div>'+demo.platform+' · source: '+(demo.source?'chosen':'existing bundle')+' · flat: '+flatStatus()+' · VR: '+vrStatus()+' · session: '+(demo.running?'running':'stopped')+' · page: '+demo.view+'</div><div>Settings: '+esc(demo.settings.resolution)+', '+esc(demo.settings.window)+', '+esc(demo.settings.preset)+' · '+esc(demo.settings.turn)+' turning · VR scale '+esc(demo.settings.scale)+'</div>';console.info('Prototype state',JSON.parse(JSON.stringify({variant:variant,...demo}))); }
function setVariant(value){variant=value;try{const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);}catch(e){console.info('Inline preview: variant selection stays in memory.');}render();}
function cycle(direction){const keys=Object.keys(names);setVariant(keys[(keys.indexOf(variant)+direction+keys.length)%keys.length]);}
function selectScene(value){demo.scene=value;demo.view=['update','rollback'].includes(value)?'updates':'home';demo.running=value==='fallback';demo.progress=42;demo.event='';}
document.addEventListener('click',function(e){const variantButton=e.target.closest('[data-variant]');if(variantButton){setVariant(variantButton.dataset.variant);return;}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
if(a==='home'){demo.view='home';if(['update','rollback'].includes(demo.scene))demo.scene='everyday';}
if(a==='settings')demo.view='settings';
if(a==='updates')demo.view='updates';
if(a==='setup'){demo.view='setup';}
if(a==='choose-folder'){demo.source='Example dump / CUSA01127';demo.event='Example folder selected. Nothing was read from disk.';}
if(a==='choose-pkg'){demo.source='Example / P.T.-CUSA01127.pkg';demo.event='Example package selected. Nothing was read from disk.';}
if(a==='adopt'){demo.scene='everyday';demo.view='home';demo.event='Demo: existing archives, saves and mods adopted in place.';}
if(a==='install'){demo.scene='extracting';demo.view='home';demo.progress=42;demo.event='Demo preparation started.';}
if(a==='advance'){demo.progress=Math.min(100,demo.progress+29);if(demo.progress===100){demo.scene='everyday';demo.event='Demo preparation complete. VR still needs verification.';}}
if(a==='cancel'){demo.scene='setup';demo.view='home';demo.event='Demo preparation cancelled. The source and existing player data stay unchanged.';}
if(a==='flat'){demo.running=true;demo.event='Demo: flat launch requested. No real game was started.';}
if(a==='vr'){demo.running=true;demo.event='Demo: VR launch requested. A running process alone does not confirm a VR session.';}
if(a==='stop'){demo.running=false;if(demo.scene==='fallback')demo.scene='everyday';demo.event='Demo session ended. In-game changes would be read back here.';}
if(a==='continue'){demo.scene='everyday';demo.running=true;demo.event='Demo: continuing the existing flat session.';}
if(a==='retry-launch'){demo.running=false;demo.scene='everyday';demo.event='Demo: game closed. You can retry VR when ready.';}
if(a==='retry'){demo.scene='everyday';demo.event='Demo recheck: VR remains unverified; Try anyway is available.';}
if(a==='help')demo.event='Demo setup steps: connect your headset, establish Steam Link if used, start your chosen OpenXR runtime, then retry. The launcher does not change your system runtime.';
if(a==='log')demo.event='Demo log: VR initialization failed; the game continued in flat mode. No real log was read.';
if(a==='save-settings'){demo.view='home';demo.event='Demo settings applied in memory only. Unexposed upstream options would be preserved.';}
if(a==='check-update'){demo.scene='update';demo.event='Demo: a paired downstream launcher/runtime release is available.';}
if(a==='update'){demo.scene='everyday';demo.view='home';demo.event='Demo: program files updated together. Player archives, saves, mods and settings kept.';}
if(a==='fail-update'){demo.scene='rollback';demo.view='updates';demo.event='Demo: update failed and the previous program version was restored.';}
render();});
document.addEventListener('input',function(e){if(e.target.id==='source-path'){demo.source=e.target.value;const b=app.querySelector('[data-action="install"]');if(b)b.disabled=!demo.source;}if(e.target.dataset.setting){demo.settings[e.target.dataset.setting]=e.target.type==='checkbox'?e.target.checked:e.target.value;}});
document.addEventListener('change',function(e){if(e.target.id==='layout-select'){setVariant(e.target.value);return;}if(e.target.name==='launch-mode'){demo.launchMode=e.target.value;render();return;}if(e.target.id==='scene'){selectScene(e.target.value);render();}if(e.target.id==='platform'){demo.platform=e.target.value;demo.event='Platform changed in the example only; no hardware detection.';render();}});
document.getElementById('previous').onclick=function(){cycle(-1);};document.getElementById('next').onclick=function(){cycle(1);};
document.getElementById('reset').onclick=function(){selectScene('everyday');demo.source='';demo.launchMode='flat';render();};
document.addEventListener('keydown',function(e){if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1);}});
render();
</script>
